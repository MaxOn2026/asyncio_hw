[project]
name = "starwars-hw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maxim", email = "vanvanov14@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "greenlet>=3.5.6",
    "jsonify>=0.5",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
starwars-hw = "starwars_hw:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
